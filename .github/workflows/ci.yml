name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run mypy services scripts
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    env:
      # Заглушки LLM: тесты детерминированные, внешние API не вызываются.
      LLM_PROVIDER: stub
      VITE_USE_MOCKS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run pytest services tests/contract --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [api, profile, ingestion, ranking, agent]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alfa-insight/${{ matrix.service }}:ci services/${{ matrix.service }}

  docker-frontend:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alfa-insight/frontend:ci frontend
