# Каталог описаний продуктов (синтетический, для демонстрации нативных предложений). НЕ аналитика банка.
# Предложение показывается отдельно от аналитики и только если уместно для компании и события.
version: 1
products:
  - id: refinance_fix
    title: "Рефинансирование и фиксация ставки по кредиту"
    text: "Обсудить с менеджером перевод плавающей ставки на фиксированную или рефинансирование — если ставка и график платежей влияют на ваши расчёты."
    for: [rate_risk]
  - id: deposit_short
    title: "Депозиты и накопительные счета для бизнеса"
    text: "Разместить свободные остатки на срок, согласованный с ближайшим заседанием ЦБ и вашим платёжным календарём."
    for: [deposit_opportunity]
  - id: fx_control
    title: "Валютный контроль и конверсия по курсу банка"
    text: "Согласовать с менеджером порядок валютных расчётов, сроки конверсии и инструменты защиты от курсовых колебаний."
    for: [fx_risk]
  - id: payroll_project
    title: "Зарплатный проект"
    text: "Проверить условия зарплатного проекта и кредитных лимитов под рост фонда оплаты труда."
    for: [payroll_risk]
  - id: factoring
    title: "Факторинг"
    text: "Рассмотреть финансирование поставок, если у покупателей растут сроки оплаты."
    for: [working_capital_risk]
  - id: guarantees
    title: "Банковские гарантии"
    text: "Обсудить гарантии и лимиты под контракты, если растёт стоимость поставок или сроки расчётов."
    for: [contract_risk]
