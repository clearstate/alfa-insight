# Поправки к сопоставлению industry_terms.yaml (владелец словаря — участник 1; здесь только локальные обходы, пока нет лемматизации).
# neutralize — контексты, которые вырезаются из текста ПЕРЕД поиском отраслевых терминов (ложные срабатывания основ слов).
# min_score — повышенный порог для «общих» отраслей, упоминаемых в любой макро-заметке.
version: 1
neutralize:
  - "портфел\\w*"                 # 'порт' (shipping) ловит «портфель»
  - "(?:в|за|из-за|по|вследствие)\\s+связи?\\s+с\\w*"   # 'связи' (telecom) — предлог «в связи с»
  - "связи\\s+с\\s"
  - "(?:этой|данной|той|такой)\\s+связи"         # «в этой связи»
  - "ценн\\w*\\s+бумаг\\w*"       # 'бумаг' (forestry_paper) — «ценные бумаги»
  - "бумаг\\w*\\s+(?:и|или)\\s+облигац\\w*"
  - "(?<!газетн[а-я]{2} )(?<!офисн[а-я]{2} )(?<!туалетн[а-я]{2} )(?<!упаковочн[а-я]{2} )бумаг\\w*"   # «бумаг» = ценные бумаги, если не вид бумаги
  - "банк\\w*\\s+росси\\w*"       # «Банк России» — регулятор, не отрасль «финансы»
  - "\\bцб\\s*рф\\b"
min_score:
  finance: 15
