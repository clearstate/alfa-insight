# Конфиг источников. ВАЖНО: из песочницы сети не было — адреса НЕ проверены. Перед включением (enabled: true)
# команда запускает `python -m services.news_ingest.cli verify-sources` (robots.txt, доступность, формат) на машине с сетью
# и вносит результат в verified_at/notes. Не включать источник без проверки условий использования.
version: 1
defaults: {timeout_s: 10, max_bytes: 5000000, retries: 2, backoff_s: 1.0, min_interval_s: 2.0, user_agent: "AlfaInsightBot/0.1 (hackathon; contact: team)"}
sources:
  - id: alfa_bank_analytics
    type: bank_analytics
    name: "Центр макроэкономического анализа / Аналитика Альфа-Банка (материалы кейса)"
    method: bank_pdf_dir
    path: data/bank_analytics
    reliability: {score: 0.9, rule: "первоисточник кейса; прогнозы/оценки банка помечаются bank_view, не fact"}
    enabled: true
    verified_at: "2026-10-21 (локальные файлы кейса)"
  - id: cbr_press
    type: regulator
    name: "Банк России — пресс-релизы"
    method: rss
    url: "https://www.cbr.ru/rss/RssPress"
    reliability: {score: 0.95, rule: "регулятор, первичный источник решений по ставке"}
    enabled: false
    verified_at: null
    notes: "URL известен по публичной документации ЦБ, но НЕ проверен в этой среде (нет сети); проверить robots.txt/условия, формат ленты. Если недоступно — импорт файлом (cli import-file)."
  - id: manual_file
    type: user_submitted
    name: "Ручной импорт файла/текста/URL (POST /api/news/ingest, cli import-file)"
    method: manual
    reliability: {score: 0.3, rule: "пользовательский ввод; без подтверждения издателя"}
    enabled: true
    verified_at: null
