# Дополнение к topic_rules.yaml (insight-слой, v1.1). Регулярные выражения по тексту в нижнем регистре, ё->е.
# Добавлено после прогона синтетической ленты: базовые правила пропускали общепит, упаковку, налоги, запчасти, фрахт.
version: 1
topics:
  taxes: ["налог", "\\bндс\\b", "\\bфнс\\b", "налогов\\w*\\s+служб", "деклараци", "отчетност\\w*\\s+по\\s+ндс"]
  regulation: ["регулирован", "законопроект", "минпромторг", "утилизационн\\w*\\s+сбор", "постановлени", "новые\\s+требовани", "ввод\\w*\\s+ограничени"]
  auto_market: ["автозапчаст", "автокомпонент", "автомобильн\\w*\\s+комплектующ", "комплектующ\\w*\\s+для\\s+автомобил", "автодилер", "запчаст", "утилизационн\\w*\\s+сбор"]
  consumer_demand: ["общепит", "общественн\\w*\\s+питани", "оборот\\w*\\s+ресторан", "средн\\w*\\s+чек", "покупательн\\w*\\s+способност", "спрос\\w*\\s+на\\s+упаковк", "потребител\\w*\\s+экономят"]
  retail: ["ресторан", "рестораторы", "общепит", "онлайн-торговл"]
  fx_rates: ["курс\\w*\\s+юан", "юан\\w*\\s+(превысил|вырос|ослаб|укреп)", "рубл\\w*\\s+(ослаб|укреп)", "стоимост\\w*\\s+импортн\\w*\\s+контракт"]
  logistics: ["фрахт", "контейнер", "грузоперевозк", "железнодорожн", "перевозк", "порт\\w*\\s+шанха", "подвижн\\w*\\s+состав", "складск"]
  real_estate: ["аренд", "складск", "коммерческ\\w*\\s+недвижимост", "вакантност", "арендодател"]
  commodities: ["макулатур", "целлюлоз", "гофрокартон", "гофротар", "металлопрокат", "арматур", "цемент", "стоимост\\w*\\s+сырь", "цен\\w*\\s+на\\s+сырь"]
  metals: ["металлопрокат", "арматур"]
  construction: ["подрядчик", "новостройк", "проектн\\w*\\s+финансирован", "жилых\\s+комплекс"]
  labor_market: ["дефицит\\w*\\s+(кадр|персонал|работник)", "рынок\\w*\\s+труда", "безработиц", "нехватк\\w*\\s+персонал", "нехватк\\w*\\s+кадр"]
  wage_inflation: ["средн\\w*\\s+заработн\\w*\\s+плат", "зарплат\\w*\\s+вырос", "фонд\\w*\\s+оплаты\\s+труда", "повышат\\w*\\s+оплат"]
  credit_conditions: ["долгов\\w*\\s+нагрузк", "кредитн\\w*\\s+нагрузк", "залогов", "проектн\\w*\\s+финансирован", "лизинг", "закредит", "рефинансирован"]
  deposit_rates: ["накопительн\\w*\\s+счет", "корпоративн\\w*\\s+депозит"]
  key_rate: ["ключев\\w*\\s+ставк", "заседани\\w*\\s+банка\\s+росси", "решени\\w*\\s+банка\\s+росси"]
  sanctions: ["ужесточ\\w*\\s+проверк", "задержк\\w*\\s+(международн\\w*\\s+)?платеж", "расчет\\w*\\s+с\\s+российск", "вторичн\\w*\\s+санкци"]
  foreign_trade: ["импортер", "ввоз", "ввозим", "поставк\\w*\\s+из\\s+китая", "закупк\\w*\\s+за\\s+рубеж"]
  wholesale_trade: ["оптов\\w*\\s+(компани|торговц|поставщик)", "оптовик"]
  consumer_credit: ["автокредит", "потребительск\\w*\\s+кредитовани"]
