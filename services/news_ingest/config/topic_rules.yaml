# Правила тем news_item.topics (словарь v1 участника 1: 36 тем). Значения — регулярные выражения по тексту в нижнем регистре, ё->е.
# Совпадение в заголовке весит x3. Тема принимается при score >= min_score или при совпадении в заголовке.
# Лемматизации нет (она недоступна без внешних моделей): основы слов + \w*.
version: 1
min_score: 2
max_topics: 8
topics:
  agro: ["сельскохозяйств", "урожа", "зерн", "\\bагро", "аграрн"]
  auto_market: ["автомобил", "автокредит", "легков\\w*\\s+машин", "продаж\\w*\\s+авто"]
  bond_market: ["\\bофз", "облигац", "\\brgbi\\b", "флоутер", "аукцион\\w*\\s+офз", "доходност\\w*\\s+(офз|облигац)"]
  business_activity: ["деловая\\s+активност", "бизнес-климат", "промпроизводств", "промышленн\\w*\\s+производств", "\\bpmi\\b", "инвестиц"]
  chemicals: ["хими", "удобрени", "нефтехим", "полимер"]
  commodities: ["сырьев", "commodit", "товарн\\w*\\s+рын", "цен\\w*\\s+на\\s+(нефть|газ|металл|уголь|зерно)"]
  construction: ["строительн", "застройщик", "стройматериал", "ввод\\w*\\s+жиль"]
  consumer_credit: ["потребительск\\w*\\s+кредит", "потребкредит", "кредит\\w*\\s+наличными", "розничн\\w*\\s+кредит", "закредит"]
  consumer_demand: ["потребительск\\w*\\s+спрос", "оборот\\w*\\s+розничной\\s+торговл", "потреблени", "потребительск\\w*\\s+актив"]
  counterparty_risk: ["дефолт", "банкротств", "кредитн\\w*\\s+риск", "кредитн\\w*\\s+рейтинг", "рейтинг\\w*\\s+(акра|эксперт)", "понижени\\w*\\s+рейтинг", "просрочк"]
  credit_conditions: ["корпоративн\\w*\\s+кредит", "кредитовани", "кредитн\\w*\\s+портфел", "льготн\\w*\\s+кредит", "плавающ\\w*\\s+ставк", "макропруденц"]
  # «вклад» — банковский вклад, но не «вклад в решение задач / внёс вклад» (заметки о наградах)
  deposit_rates: ["депозит", "(?<!внес\\s)(?<!внесли\\s)\\bвклад(?!\\w*\\s+в\\s+(решени|развити|дело|победу|борьб|укреплени|реализаци|подготовк|становлени|работ))", "сбережени"]
  export: ["экспорт"]
  financial_regulation: ["регулятор", "норматив", "достаточност\\w*\\s+капитал", "ужесточени\\w*\\s+(регулирован|требован)", "бюджетн\\w*\\s+правил"]
  food_prices: ["продовольств", "плодоовощ", "цен\\w*\\s+на\\s+(продукт|продовольств|овощ)", "овощ"]
  foreign_trade: ["импорт", "экспорт", "внешн\\w*\\s+торговл", "торгов\\w*\\s+баланс", "счет\\w*\\s+текущих\\s+операций", "таможенн", "пошлин"]
  fuel_prices: ["бензин", "дизел", "(?<!ядерного\\s)(?<!ядерное\\s)(?<!отработавшего\\s)топлив", "нефтепродукт"]
  fx_rates: ["курс\\w*\\s+(рубл|доллар|юан)", "руб\\./\\$", "рубл\\w*\\s+(ослаб|укреп)", "валютн\\w*\\s+курс", "ослаблени\\w*\\s+курса", "укреплени\\w*\\s+курса"]
  gdp: ["\\bввп\\b", "валов\\w*\\s+внутренн", "экономическ\\w*\\s+рост", "темп\\w*\\s+роста\\s+ввп"]
  gold: ["золот", "драгметалл", "драгоценн\\w*\\s+металл"]
  import_substitution: ["импортозамещ", "локализаци"]
  inflation: ["инфляц", "потребительск\\w*\\s+цен", "\\bипц\\b", "дефляц", "рост\\w*\\s+цен"]
  it: ["информационн\\w*\\s+технолог", "программн\\w*\\s+обеспечен", "искусственн\\w*\\s+интеллект", "цифров"]
  key_rate: ["ключев\\w*\\s+ставк", "ставк\\w*\\s+(цб|банка\\s+росси)", "\\bдкп\\b", "денежно-кредитн", "заседани\\w*\\s+(цб|совета\\s+директоров)"]
  labor_market: ["рынок\\w*\\s+труда", "безработиц", "ваканси", "зарплат", "занятост"]
  liquidity: ["ликвидност", "денежн\\w*\\s+рынок", "\\bruonia\\b"]
  logistics: ["логистик", "перевозк", "грузоперевозк", "склад", "транспортн\\w*\\s+инфраструктур", "морск\\w*\\s+порт"]
  metals: ["\\bметалл", "\\bсталь", "стальн", "алюмин", "\\bмедь\\b", "никел", "железн\\w*\\s+руд", "металлург"]
  mortgage: ["ипотек"]
  oil_gas: ["\\bнефт", "природн\\w*\\s+газ", "нефтегаз", "\\bopec\\b", "нефтепереработ", "\\bbrent\\b", "\\burals\\b", "юралс"]
  real_estate: ["недвижимост", "жилищн", "девелопер"]
  retail: ["розничн\\w*\\s+торговл", "ритейл", "маркетплейс"]
  sanctions: ["санкци", "\\bswift\\b", "заморажив\\w*\\s+актив"]
  tourism: ["туризм", "туристическ", "гостиниц", "\\bотел"]
  wage_inflation: ["рост\\w*\\s+зарплат", "номинальн\\w*\\s+зарплат", "зарплатн\\w*\\s+ожидани", "оплат\\w*\\s+труда"]
  wholesale_trade: ["оптов\\w*\\s+торговл", "дистрибь"]
