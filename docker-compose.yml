name: alfa-insight

x-service-env: &service-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://cache:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  profile:
    build: ./services/profile
    <<: *service-env
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8001:8000"

  ingestion:
    build: ./services/ingestion
    <<: *service-env
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    ports:
      - "8002:8000"

  ranking:
    build: ./services/ranking
    <<: *service-env
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8003:8000"

  agent:
    build: ./services/agent
    <<: *service-env
    depends_on:
      profile: { condition: service_started }
      ranking: { condition: service_started }
      ingestion: { condition: service_started }
    ports:
      - "8004:8000"

  api:
    build: ./services/api
    <<: *service-env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PROFILE_SERVICE_URL: http://profile:8000
      INGESTION_SERVICE_URL: http://ingestion:8000
      RANKING_SERVICE_URL: http://ranking:8000
      AGENT_SERVICE_URL: http://agent:8000
    depends_on:
      - agent
    ports:
      - "8080:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
