# Запуск: cp .env.example .env && docker compose up --build   →   http://localhost:8080  (логин demo / пароль demo)
services:
  insight:
    build: .
    ports: ["${ALFA_PORT:-8080}:8080"]
    env_file: [{path: .env, required: false}]
    environment:
      ALFA_HOST: 0.0.0.0
      PORT: "8080"
    volumes:
      - insight-runtime:/app/data/runtime            # база новостей, журналы (обратная связь, действия, аудит), кеш LLM
      # Полные CSV кейса (по желанию): положить в ./data/raw и раскомментировать
      # - ./data/raw:/app/data/raw:ro
      # PDF материалов банка для кнопки «Открыть PDF» (по желанию)
      # - ./data/bank_pdf:/app/data/bank_pdf:ro
volumes:
  insight-runtime: {}
