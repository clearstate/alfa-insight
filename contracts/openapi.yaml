openapi: 3.1.0
info:
  title: alfa-insight API
  version: 0.1.0
  description: |
    Единый контракт шлюза. Модели тел ответов описаны в contracts/schemas/*.py;
    здесь — маршруты, авторизация и коды ошибок. Владелец: участник 6.
servers:
  - url: /api
    description: Behind the API gateway
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: companies
  - name: feed
  - name: insights
  - name: trace
  - name: ops
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Токен доступа
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /companies:
    get:
      tags: [companies]
      operationId: listCompanies
      description: Список клиентов, доступных текущему пользователю
      responses:
        "200":
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /companies/{companyId}:
    get:
      tags: [companies]
      operationId: getCompany
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Профиль компании
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /companies/{companyId}/feed:
    get:
      tags: [feed]
      operationId: getFeed
      description: Ранжированная лента событий по клиенту
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Лента
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankedEvents" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /companies/{companyId}/insights/{eventId}:
    get:
      tags: [insights]
      operationId: getInsight
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Инсайт по событию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessInsight" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /companies/{companyId}/insights/{eventId}/ask:
    post:
      tags: [insights]
      operationId: askFollowUp
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 500 }
                question_chip_id: { type: string }
      responses:
        "200":
          description: Ответ с опорой на доказательства
          content:
            application/json:
              schema:
                type: object
                required: [answer, claims]
                properties:
                  answer: { type: string }
                  claims:
                    type: array
                    items: { $ref: "#/components/schemas/Claim" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /runs/{runId}/trace:
    get:
      tags: [trace]
      operationId: getTrace
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Трасса исполнения агента
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunTrace" }
        "404": { $ref: "#/components/responses/NotFound" }
  /health:
    get:
      tags: [ops]
      security: []
      operationId: health
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Нет или невалидный токен
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Нет прав на клиента
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Превышен лимит запросов к LLM
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UpstreamError:
      description: Ошибка нижестоящего сервиса или LLM
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    # Зеркало contracts/schemas/*.py. При изменениях: make openapi && make test-contract.
    CompanyProfile:
      type: object
      required: [company_id, name, completeness]
      properties:
        company_id: { type: string }
        name: { type: string }
        inn: { type: [string, "null"] }
        okved: { type: array, items: { type: string } }
        industry: { type: [string, "null"] }
        region: { type: [string, "null"] }
        revenue: { type: [number, "null"] }
        employees: { type: [integer, "null"] }
        products: { type: array, items: { type: string } }
        key_partners: { type: array, items: { type: string } }
        links:
          type: array
          items:
            type: object
            required: [target_name, relation_type, strength]
            properties:
              target_company_id: { type: [string, "null"] }
              target_name: { type: string }
              relation_type: { type: string }
              strength: { type: number, minimum: 0, maximum: 1 }
        completeness: { type: number, minimum: 0, maximum: 1 }
        missing_fields: { type: array, items: { type: string } }
        updated_at: { type: [string, "null"] }
    Event:
      type: object
      required: [event_id, event_type, title, summary]
      properties:
        event_id: { type: string }
        event_type:
          type: string
          enum: [mna, regulation, market_shift, supply_chain, finance, personnel, product, risk, other]
        title: { type: string }
        summary: { type: string }
        companies: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        severity: { type: [string, "null"] }
        occurred_at: { type: [string, "null"], format: date-time }
        news_item_ids: { type: array, items: { type: string } }
    RankedEvents:
      type: object
      required: [company_id, items]
      properties:
        company_id: { type: string }
        generated_at: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            required: [event, score, relevance_explanation, rank]
            properties:
              event: { $ref: "#/components/schemas/Event" }
              score: { type: number, minimum: 0, maximum: 1 }
              relevance_explanation: { type: string }
              matched_features: { type: array, items: { type: string } }
              rank: { type: integer, minimum: 1 }
    Claim:
      type: object
      required: [claim_id, text, claim_type, confidence, provenance]
      properties:
        claim_id: { type: string }
        text: { type: string }
        claim_type:
          type: string
          enum: [fact, inference, recommendation, estimate]
        confidence: { type: number, minimum: 0, maximum: 1 }
        provenance:
          type: array
          items:
            type: object
            required: [source_id, fragment, retrieved_at]
            properties:
              source_id: { type: string }
              source_name: { type: [string, "null"] }
              url: { type: [string, "null"] }
              published_at: { type: [string, "null"], format: date-time }
              fragment: { type: string }
              retrieved_at: { type: string, format: date-time }
    BusinessInsight:
      type: object
      required: [insight_id, company_id, event_id, title, reference, claims, confidence, generated_at]
      properties:
        insight_id: { type: string }
        company_id: { type: string }
        event_id: { type: string }
        title: { type: string }
        reference: { type: string }
        audience: { type: [string, "null"] }
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        questions: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        generated_at: { type: string, format: date-time }
    RunTrace:
      type: object
      required: [run_id, company_id, schema_version, steps, total_duration_ms]
      properties:
        run_id: { type: string }
        company_id: { type: string }
        event_id: { type: [string, "null"] }
        schema_version: { type: string }
        model_versions: { type: object, additionalProperties: { type: string } }
        prompt_versions: { type: object, additionalProperties: { type: string } }
        critic_passed: { type: [boolean, "null"] }
        total_duration_ms: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [step, kind, name, status, started_at, duration_ms]
            properties:
              step: { type: integer }
              kind:
                type: string
                enum: [plan, tool, synthesis, critic, revision]
              name: { type: string }
              status: { type: string, enum: [ok, error, skipped] }
              started_at: { type: string, format: date-time }
              duration_ms: { type: integer }
              input: { type: [object, "null"] }
              output: { type: [object, "null"] }
              error: { type: [string, "null"] }
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        request_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, validation_error, upstream_error, llm_error, rate_limited, internal_error]
            message: { type: string }
            details: { type: [object, "null"] }
