# Локальный стенд news_ingest: PostgreSQL + API (порт 8002). Не запускался в среде разработки (нет Docker) — проверить на стенде.
#   cp .env.example .env  (POSTGRES_PASSWORD, при желании LLM_BASE_URL/LLM_API_KEY)
#   docker compose -f docker-compose.news_ingest.yml up --build
# Первая вертикаль: при старте API (NEWS_BOOTSTRAP_BANK=1) загружаются 9 документов банка из data/bank_analytics.
# Участник 6: перенести сервис в общий docker-compose; схема БД — `news_ingest` (создаётся автоматически).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa_insight}
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata_news:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  news-ingest-api:
    build: {context: ., dockerfile: Dockerfile.news_ingest}
    environment:
      NEWS_DB_URL: postgresql://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alfa_insight}
      NEWS_BOOTSTRAP_BANK: "1"
      NEWS_STANDALONE_AUTH: demo   # заглушка X-User-ID; в общем приложении убрать
      NEWS_INGEST_OPEN: ${NEWS_INGEST_OPEN:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-150000}
    ports: ["${NEWS_INGEST_PORT:-8002}:8002"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pgdata_news:
