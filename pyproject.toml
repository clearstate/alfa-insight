# Зависимости модуля company_profile. Если в монорепозитории уже есть корневой pyproject (участник 6) —
# перенести группы зависимостей туда. uv.lock генерируется командой `uv lock` (нужна сеть) и коммитится.
[project]
name = "alfa-insight-company-profile"
version = "0.3.0"
description = "Alfa Insight: профиль компании и пользователя из данных кейса (участник 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    "PyYAML>=6.0,<7",
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
# Ошибки, а не стиль: pyflakes (неиспользуемое, неопределённые имена), синтаксис, bugbear (замыкания в циклах, assert False и т.п.).
# B008 — Depends()/Query() в аргументах FastAPI; B904/B905 — raise без from и zip без strict, приняты в кодовой базе.
select = ["F", "E9", "B"]
ignore = ["B008", "B904", "B905"]
