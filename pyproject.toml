[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-insight"
version = "0.1.0"
description = "AI-powered personalized business news analytics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  "httpx",
  "jsonschema",
  "openapi-spec-validator",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.uv.workspace]
members = [
  "services/api",
  "services/profile",
  "services/ingestion",
  "services/ranking",
  "services/agent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["backend/src", "services"]
omit = ["*/tests/*"]
