[project]
name = "alfa-insight"
version = "0.1.0"
description = "AI-powered personalized business news analytics"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Workspace-пакет: сами сервисы объявляют зависимости в своих pyproject.toml
# и подключаются сюда как editable-зависимости (uv workspaces / path-зависимости).
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  "httpx",
  "jsonschema",
  "openapi-spec-validator",
  "pyyaml",
]

[tool.uv.workspace]
members = [
  "services/api",
  "services/profile",
  "services/ingestion",
  "services/ranking",
  "services/agent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["services"]
omit = ["*/tests/*"]
